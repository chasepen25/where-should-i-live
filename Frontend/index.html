<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <title>Where Should I Live?</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='Script.js') }}" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow"><span class="eyebrow-mark" aria-hidden="true">✳</span> A little help finding your next place</p>
    <h1>Where should<br>you live?</h1>
    <p class="intro">Share your housing plans and budget to find states worth exploring.</p>
    <form id="rent-form">
      <p class="form-heading">A few details to get started</p>
      <label for="housing-plan">Are you looking to rent or buy?</label>
      <select id="housing-plan" name="housing-plan" required>
        <option value="rent">Rent</option>
        <option value="buy">Buy</option>
      </select>
      <label id="budget-label" for="housing-budget">What is your maximum monthly rent?</label>
      <div>
        <span aria-hidden="true">$</span>
        <input
          id="housing-budget"
          name="housing-budget"
          type="number"
          min="0"
          step="50"
          value="1500"
          placeholder="1500"
          required
        >
      </div>
      <label for="household-income">What is your annual household income?</label>
      <div>
        <span aria-hidden="true">$</span>
        <input id="household-income" name="household-income" type="number" min="0" step="1000" value="75000" placeholder="75000" required>
      </div>
      <button type="submit">Find my places <span aria-hidden="true">→</span></button>
    </form>
    <p class="disclaimer">Demo estimates for testing only. Rents are illustrative, not live listings.</p>
    <section id="results" aria-live="polite" aria-busy="false"></section>
    <footer class="page-footer">A thoughtful next step toward feeling at home.</footer>
  </main>
</body>
</html>
